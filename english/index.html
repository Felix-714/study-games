<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>莊園英文逃生 · Adaptive v2.4</title><style>
:root{--gold:#d9b36c;--card:rgba(15,20,29,.93);--line:#4d5665;--text:#f0eadf;--muted:#b5b0a5;--good:#7ed19a;--bad:#ff8d86}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,"Noto Sans HK",sans-serif;background:#080b10 url('manor-background.png') center/cover fixed no-repeat;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(5,8,13,.93),rgba(8,12,18,.67),rgba(5,8,13,.93));z-index:-1}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 16px 50px #0008;border-radius:18px}.hero{padding:20px;text-align:center}.hero h1{margin:0;color:var(--gold)}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.back,.lesson{color:#d9c8a4;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#101620d9;border:1px solid #384254;border-radius:12px;padding:12px}.stat b{display:block;color:var(--gold);font-size:1.3rem}.panel{padding:20px;margin-top:16px}.mission{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:10px;background:#171d27;border:1px solid #414958;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#3e8f78,var(--gold),#6e2630)}.question{padding:16px;background:#111822eb;border-left:4px solid var(--gold);border-radius:8px}.meta{font-size:.78rem;color:#9eb0c8}.label{display:inline-block;border:1px solid #526078;border-radius:999px;padding:4px 8px;margin-right:5px}.concept{color:var(--gold);font-weight:750;margin:10px 0 4px}.q{font-weight:750;font-size:1.05rem;margin:12px 0}.options{display:grid;gap:8px}.option,.input{width:100%;text-align:left;padding:11px 12px;background:#17202c;border:1px solid #39475b;color:var(--text);border-radius:8px}.option{cursor:pointer}.option:hover,.option:focus,.input:focus{border-color:var(--gold);outline:none}.option.correct{background:#183929;border-color:var(--good)}.option.wrong{background:#462027;border-color:var(--bad)}.explain{margin-top:12px;color:#d9d0be;line-height:1.65;border-top:1px solid #354050;padding-top:10px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:1px solid #80683d;background:#322817;color:#f5dfb0;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:700}.btn.secondary{background:#151c26;border-color:#46536a;color:#d8e0ec}.btn:disabled{opacity:.35}.status{position:fixed;right:10px;bottom:10px;background:#111822;border:1px solid #566174;padding:8px 11px;border-radius:8px;font-size:.76rem}.good{color:var(--good)}.bad{color:var(--bad)}.hidden{display:none}.result{text-align:center;padding:18px}.score{font-size:3rem;color:var(--gold);font-weight:900}.scope{margin:12px 0;padding:10px;background:#111822;border:1px solid #354050;border-radius:9px;color:#c9c2b5}.scope label{margin:0 8px;white-space:nowrap}.btn.small{padding:6px 10px;margin-left:8px}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.mission,.topline{align-items:flex-start;flex-direction:column}.wrap{padding:9px}.panel{padding:13px}}
</style></head><body><main class="wrap"><section class="hero"><div class="topline"><a class="back" href="../">← 切換玩家</a><a class="lesson" href="lessons/present-perfect/">🌱 學習花園</a><strong id="player">玩家</strong></div><h1>🕯️ 莊園英文逃生</h1><p>Adaptive v2.4 · 每輪15題 · 隱藏考點測試 · P1-P6基礎修復</p><div class="stats"><div class="stat"><b id="sAttempts">–</b>歷史作答</div><div class="stat"><b id="sAccuracy">–</b>正確率</div><div class="stat"><b id="sWeak">–</b>目前補強</div><div class="stat"><b id="sBank">–</b>題庫</div></div></section><section class="panel"><div class="mission"><div><h2 id="title">正在讀取題庫…</h2><div id="subtitle" class="meta"></div></div><button class="btn secondary" id="newBtn" type="button">開始新任務</button></div><div class="scope"><strong>📘 6A考試範圍：</strong><span id="scopeChecks"></span><button class="btn secondary small" id="saveScope" type="button">套用</button></div><div class="progress"><div id="bar" class="bar"></div></div><div id="quiz"></div><div id="result" class="result hidden"></div><div class="actions"><button id="prevBtn" class="btn secondary" type="button">⬅ 上一題</button><button id="nextBtn" class="btn" type="button">下一題 ➡</button></div></section></main><div id="cloud" class="status">☁️ 正在連接…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://wxusktzdvpqxhxpyondx.supabase.co',SB_KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM',GAME='adaptive-longman-6A-v2.4',ALLOWED=['Chelsea','Felix','Rachel','Savanna'];
const params=new URLSearchParams(location.search),remembered=localStorage.getItem('studyGamesUser');const STUDENT=ALLOWED.includes(params.get('student'))?params.get('student'):(ALLOWED.includes(remembered)?remembered:'Chelsea');localStorage.setItem('studyGamesUser',STUDENT);document.getElementById('player').textContent=`玩家：${STUDENT}`;
let sb,studentId,studentLevel=6,sessionId,BANK=[],history=[],mission=[],idx=0,answers={},openedAt=Date.now();let EXAM_SCOPE=JSON.parse(localStorage.getItem(`longman6AScope_${STUDENT}`)||'[1,2,3,4]');const $=id=>document.getElementById(id),norm=v=>String(v??'').trim().toLowerCase();
function status(t,c=''){$('cloud').textContent=t;$('cloud').className='status '+c}function pct(n,d){return d?Math.round(n/d*100):0}function byId(id){return BANK.find(q=>q.id===id)}
function statsMap(){const m={};history.forEach(x=>{const k=x.sub_skill_group||x.sub_skill||x.skill||'未分類';m[k]??={c:0,n:0};m[k].n++;if(x.is_correct)m[k].c++});return m}
function summarize(){const correct=history.filter(x=>x.is_correct).length;$('sAttempts').textContent=history.length;$('sAccuracy').textContent=history.length?pct(correct,history.length)+'%':'新';$('sBank').textContent=BANK.length;const weak=Object.entries(statsMap()).filter(([,v])=>v.n>=3).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n)[0];$('sWeak').textContent=weak&&weak[1].c/weak[1].n<.85?`${weak[0]} ${pct(weak[1].c,weak[1].n)}%`:'基礎穩定 ✓'}
function pick(pool,count,used,groups){const out=[];for(const q of pool){if(out.length>=count)break;const g=q.sub_skill_group||q.sub_skill;if(used.has(q.id)||(groups[g]||0)>=4)continue;used.add(q.id);groups[g]=(groups[g]||0)+1;out.push(q)}return out}
function buildMission(){const sm=statsMap(),recent=new Set(history.slice(0,35).map(x=>x.question_id)),wrong=new Set(history.filter(x=>!x.is_correct).map(x=>x.question_id)),seen=new Set(history.map(x=>x.question_id));const base=BANK.map(q=>{const g=q.sub_skill_group||q.sub_skill,s=sm[g]||{c:0,n:0};return{...q,acc:s.n?s.c/s.n:.7,rand:Math.random()}});const scope=base.filter(q=>q.book_level==='6A'&&EXAM_SCOPE.includes(q.book_chapter)).sort((a,b)=>a.acc-b.acc||a.rand-b.rand);const errors=base.filter(q=>wrong.has(q.id)&&q.primary_level<=studentLevel).sort((a,b)=>a.acc-b.acc||a.rand-b.rand);const foundation=base.filter(q=>q.curriculum_role==='foundation'&&q.primary_level<=studentLevel).sort((a,b)=>a.acc-b.acc||a.rand-b.rand);const skills=base.filter(q=>q.curriculum_role==='skills'||q.skill==='Reading'||q.skill==='Writing').sort((a,b)=>a.acc-b.acc||a.rand-b.rand);const spaced=base.filter(q=>seen.has(q.id)&&!recent.has(q.id)&&q.primary_level<=studentLevel).sort((a,b)=>a.rand-b.rand);const used=new Set(),groups={};mission=[...pick(scope,8,used,groups),...pick(errors,3,used,groups),...pick(foundation,2,used,groups),...pick(skills,1,used,groups),...pick(spaced,1,used,groups)];if(mission.length<15)mission.push(...pick(base.filter(q=>q.primary_level<=studentLevel).sort((a,b)=>a.rand-b.rand),15-mission.length,used,groups));mission=mission.slice(0,15);idx=0;answers={}}
async function createSession(){buildMission();const ids=mission.map(q=>q.id);const r=await sb.from('practice_sessions').insert({student_id:studentId,game:GAME,question_ids:ids,current_index:0,last_activity_at:new Date().toISOString()}).select('id').single();if(r.error)throw r.error;sessionId=r.data.id}
async function resumeOrCreate(){const cutoff=new Date(Date.now()-12*60*60*1000).toISOString();let r=await sb.from('practice_sessions').select('id,question_ids,current_index').eq('student_id',studentId).eq('game',GAME).is('completed_at',null).gte('started_at',cutoff).not('question_ids','is',null).order('started_at',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data){await createSession();return}sessionId=r.data.id;mission=(r.data.question_ids||[]).map(byId).filter(Boolean);idx=Math.min(r.data.current_index||0,Math.max(0,mission.length-1));r=await sb.from('attempts').select('question_id,submitted_answer,is_correct').eq('session_id',sessionId);if(r.error)throw r.error;(r.data||[]).forEach(a=>answers[a.question_id]={submitted:a.submitted_answer,correct:a.is_correct});if(mission.length!==15)await createSession()}
function render(){const q=mission[idx];if(!q)return;const a=answers[q.id],answered=!!a;$('title').textContent=`密碼機 ${idx+1} / ${mission.length}`;$('subtitle').textContent=`${STUDENT} · 6A Ch ${EXAM_SCOPE.join(', ')}：8題考試範圍、3題錯題、2題基礎、1題閱讀寫作、1題重溫`;$('bar').style.width=`${idx/mission.length*100}%`;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');let h=`<article class="question"><div class="meta"><span class="label">${q.book_level==='6A'?'6A':`P${q.primary_level}`}</span>${q.book_chapter?`<span class="label">Ch ${q.book_chapter}</span>`:''}<span class="label">${q.skill}</span><span class="label">難度 ${q.difficulty}</span></div>${answered?`<div class="concept">考點：${q.sub_skill}${q.language_focus?` · ${q.language_focus}`:''}${q.book_chapter?`<br>📘 Longman Elect 6A Chapter ${q.book_chapter} · ${q.curriculum_topic}`:''}</div>`:''}<div class="q">${idx+1}. ${q.question_text}</div>`;if(q.question_type==='fill'){h+=`<input id="fillAnswer" class="input" autocomplete="off" placeholder="輸入英文答案" ${answered?'disabled':''} value="${a?.submitted||''}"><div style="margin-top:9px"><button class="btn" onclick="submitFill()" ${answered?'disabled':''}>提交答案</button></div>`}else{h+='<div class="options">';(q.options||[]).forEach(o=>{let c='option';if(answered){if(norm(o)===norm(q.correct_answer))c+=' correct';else if(norm(o)===norm(a.submitted))c+=' wrong'}h+=`<button class="${c}" onclick='choose(${JSON.stringify(o)})' ${answered?'disabled':''}>${o}</button>`});h+='</div>'}if(answered)h+=`<div class="explain">${a.correct?'✅ 密碼破譯成功':'❌ 線索未對上'}<br>${q.explanation}</div>`;h+='</article>';$('quiz').innerHTML=h;$('prevBtn').disabled=idx===0;$('nextBtn').textContent=idx===mission.length-1?'完成任務 🏁':'下一題 ➡';$('nextBtn').disabled=!answered}
function submitFill(){const v=$('fillAnswer')?.value.trim();if(v)choose(v)}
async function choose(submitted){const q=mission[idx];if(answers[q.id])return;const correct=norm(submitted)===norm(q.correct_answer),raw=Date.now()-openedAt,effective=Math.min(raw,120000),valid=raw<=120000;answers[q.id]={submitted,correct};render();status('☁️ 正在保存…');const r=await sb.from('attempts').insert({student_id:studentId,session_id:sessionId,question_id:q.id,submitted_answer:submitted,correct_answer:q.correct_answer,is_correct:correct,response_time_ms:effective,raw_response_time_ms:raw,effective_response_time_ms:effective,response_time_valid:valid,hint_used:false,attempt_number:1,topic:q.topic,skill:q.skill,sub_skill:q.sub_skill,difficulty:q.difficulty});if(r.error){console.error(r.error);status('⚠️ 保存失敗','bad')}else{history.unshift({question_id:q.id,is_correct:correct,skill:q.skill,sub_skill:q.sub_skill,sub_skill_group:q.sub_skill_group,answered_at:new Date().toISOString()});summarize();status('✅ 作答已保存','good')}}
async function move(n){idx=n;openedAt=Date.now();await sb.from('practice_sessions').update({current_index:idx,last_activity_at:new Date().toISOString()}).eq('id',sessionId);render()}
async function finish(){const score=Object.values(answers).filter(x=>x.correct).length;$('bar').style.width='100%';$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<div class="score">${score}/15</div><h2>${score>=12?'逃生大門已開啟！':'下一輪會繼續補強弱項'}</h2><button class="btn" onclick="startNew()">開始下一輪</button>`;$('nextBtn').disabled=true;$('prevBtn').disabled=true;await sb.from('practice_sessions').update({completed_at:new Date().toISOString(),total_questions:15,correct_count:score,current_index:14,last_activity_at:new Date().toISOString()}).eq('id',sessionId)}
async function startNew(){try{await createSession();openedAt=Date.now();render()}catch(e){console.error(e);status('⚠️ 無法建立任務','bad')}}
async function init(){try{sb=window.supabase.createClient(SB_URL,SB_KEY);let r=await sb.from('students').select('id,current_primary_level').ilike('name',STUDENT).limit(1).maybeSingle();if(r.error||!r.data)throw r.error||new Error(`找不到玩家 ${STUDENT}`);studentId=r.data.id;studentLevel=r.data.current_primary_level||6;r=await sb.from('questions').select('id,topic,skill,sub_skill,sub_skill_group,primary_level,difficulty,question_type,question_text,options,correct_answer,explanation,publisher,series,book_level,book_chapter,curriculum_topic,curriculum_role,language_focus').eq('active',true);if(r.error)throw r.error;BANK=(r.data||[]).filter(q=>q.primary_level&&q.question_text&&q.correct_answer&&q.explanation&&(q.question_type==='fill'||Array.isArray(q.options)));r=await sb.from('attempts').select('question_id,is_correct,skill,sub_skill,answered_at,questions(sub_skill_group)').eq('student_id',studentId).order('answered_at',{ascending:false}).limit(700);if(r.error)throw r.error;history=(r.data||[]).map(x=>({...x,sub_skill_group:x.questions?.sub_skill_group||x.sub_skill}));summarize();await resumeOrCreate();render();status('✅ Adaptive v2.4 已連線','good')}catch(e){console.error(e);status('⚠️ 連線失敗','bad');$('title').textContent='未能建立任務';$('subtitle').textContent=e?.message||'請先執行 v2.3 migration SQL'}}
function renderScope(){const el=$('scopeChecks');el.innerHTML=[1,2,3,4,5,6].map(n=>`<label><input type="checkbox" value="${n}" ${EXAM_SCOPE.includes(n)?'checked':''}> Ch${n}</label>`).join('')}renderScope();$('saveScope').onclick=()=>{EXAM_SCOPE=[...$('scopeChecks').querySelectorAll('input:checked')].map(x=>Number(x.value));if(!EXAM_SCOPE.length)EXAM_SCOPE=[1,2,3,4];localStorage.setItem(`longman6AScope_${STUDENT}`,JSON.stringify(EXAM_SCOPE));startNew()};$('prevBtn').onclick=()=>idx>0&&move(idx-1);$('nextBtn').onclick=()=>{if(!answers[mission[idx]?.id])return;idx<mission.length-1?move(idx+1):finish()};$('newBtn').onclick=()=>confirm('開始新任務？目前未完成任務會保留。')&&startNew();init();
</script></body></html>
