<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>莊園英文逃生 · Adaptive v2.2</title><style>
:root{--gold:#d9b36c;--card:rgba(15,20,29,.93);--line:#4d5665;--text:#f0eadf;--muted:#b5b0a5;--good:#7ed19a;--bad:#ff8d86}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,"Noto Sans HK",sans-serif;background:#080b10 url('manor-background.png') center/cover fixed no-repeat;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(5,8,13,.93),rgba(8,12,18,.67),rgba(5,8,13,.93));z-index:-1}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 16px 50px #0008;border-radius:18px}.hero{padding:20px;text-align:center}.hero h1{margin:0;color:var(--gold)}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.back{color:#d9c8a4;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#101620d9;border:1px solid #384254;border-radius:12px;padding:12px}.stat b{display:block;color:var(--gold);font-size:1.3rem}.panel{padding:20px;margin-top:16px}.mission{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:10px;background:#171d27;border:1px solid #414958;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#3e8f78,var(--gold),#6e2630)}.question{padding:16px;background:#111822eb;border-left:4px solid var(--gold);border-radius:8px}.meta{font-size:.76rem;color:#9eb0c8}.q{font-weight:750;font-size:1.05rem;margin:9px 0 12px}.options{display:grid;gap:8px}.option,.input{width:100%;text-align:left;padding:11px 12px;background:#17202c;border:1px solid #39475b;color:var(--text);border-radius:8px}.option{cursor:pointer}.option:hover,.option:focus,.input:focus{border-color:var(--gold);outline:none}.option.correct{background:#183929;border-color:var(--good)}.option.wrong{background:#462027;border-color:var(--bad)}.explain{margin-top:10px;color:#d9d0be}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:1px solid #80683d;background:#322817;color:#f5dfb0;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:700}.btn.secondary{background:#151c26;border-color:#46536a;color:#d8e0ec}.btn:disabled{opacity:.35}.status{position:fixed;right:10px;bottom:10px;background:#111822;border:1px solid #566174;padding:8px 11px;border-radius:8px;font-size:.76rem}.good{color:var(--good)}.bad{color:var(--bad)}.hidden{display:none}.result{text-align:center;padding:18px}.score{font-size:3rem;color:var(--gold);font-weight:900}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.mission,.topline{align-items:flex-start;flex-direction:column}.wrap{padding:9px}.panel{padding:13px}}
</style></head><body><main class="wrap"><section class="hero"><div class="topline"><a class="back" href="../">← 切換玩家</a><strong id="player">玩家</strong></div><h1>🕯️ 莊園英文逃生</h1><p>Adaptive v2.2 · 每輪15題 · 弱項補強、錯題修復、間隔重溫</p><div class="stats"><div class="stat"><b id="sAttempts">–</b>歷史作答</div><div class="stat"><b id="sAccuracy">–</b>正確率</div><div class="stat"><b id="sWeak">–</b>目前重點</div><div class="stat"><b id="sBank">–</b>題庫</div></div></section><section class="panel"><div class="mission"><div><h2 id="title">正在讀取題庫…</h2><div id="subtitle" class="meta"></div></div><button class="btn secondary" id="newBtn" type="button">開始新任務</button></div><div class="progress"><div id="bar" class="bar"></div></div><div id="quiz"></div><div id="result" class="result hidden"></div><div class="actions"><button id="prevBtn" class="btn secondary" type="button">⬅ 上一題</button><button id="nextBtn" class="btn" type="button">下一題 ➡</button></div></section></main><div id="cloud" class="status">☁️ 正在連接…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://wxusktzdvpqxhxpyondx.supabase.co',SB_KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM',GAME='adaptive-database-v2.2',ALLOWED=['Chelsea','Felix','Rachel','Savanna'];
const params=new URLSearchParams(location.search);const remembered=localStorage.getItem('studyGamesUser');const STUDENT=ALLOWED.includes(params.get('student'))?params.get('student'):(ALLOWED.includes(remembered)?remembered:'Chelsea');localStorage.setItem('studyGamesUser',STUDENT);document.getElementById('player').textContent=`玩家：${STUDENT}`;
let sb,studentId,sessionId,BANK=[],history=[],mission=[],idx=0,answers={},openedAt=Date.now();const $=id=>document.getElementById(id);const norm=v=>String(v??'').trim().toLowerCase();
function status(t,c=''){$('cloud').textContent=t;$('cloud').className='status '+c}function pct(n,d){return d?Math.round(n/d*100):0}function byId(id){return BANK.find(q=>q.id===id)}
function skillStats(){const m={};history.forEach(x=>{const k=x.sub_skill||x.skill||'未分類';m[k]??={c:0,n:0,recent:[]};m[k].n++;if(x.is_correct)m[k].c++;if(m[k].recent.length<5)m[k].recent.push(x.is_correct?1:0)});return m}
function summarize(){const correct=history.filter(x=>x.is_correct).length;$('sAttempts').textContent=history.length;$('sAccuracy').textContent=history.length?pct(correct,history.length)+'%':'新';$('sBank').textContent=BANK.length;const weak=Object.entries(skillStats()).filter(([,v])=>v.n>=3).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n)[0];$('sWeak').textContent=weak?`${weak[0]} ${pct(weak[1].c,weak[1].n)}%`:'證據建立中'}
function pickUnique(pool,count,used,subCounts){const out=[];for(const q of pool){if(out.length>=count)break;if(used.has(q.id)||(subCounts[q.sub_skill]||0)>=3)continue;used.add(q.id);subCounts[q.sub_skill]=(subCounts[q.sub_skill]||0)+1;out.push(q)}return out}
function buildMission(){const stats=skillStats(),recentIds=new Set(history.slice(0,25).map(x=>x.question_id)),wrongIds=new Set(history.filter(x=>!x.is_correct).map(x=>x.question_id)),seenIds=new Set(history.map(x=>x.question_id));const base=BANK.map(q=>{const s=stats[q.sub_skill]||{c:0,n:0},acc=s.n?s.c/s.n:.7;return{...q,acc,rand:Math.random()}});const weak=base.filter(q=>(stats[q.sub_skill]?.n||0)>=3).sort((a,b)=>a.acc-b.acc||a.rand-b.rand);const errors=base.filter(q=>wrongIds.has(q.id)).sort((a,b)=>a.rand-b.rand);const unseen=base.filter(q=>!seenIds.has(q.id)).sort((a,b)=>a.rand-b.rand);const spaced=base.filter(q=>seenIds.has(q.id)&&!recentIds.has(q.id)).sort((a,b)=>a.rand-b.rand);const challenge=base.filter(q=>q.difficulty>=3).sort((a,b)=>a.rand-b.rand);const used=new Set(),sub={};mission=[...pickUnique(weak,6,used,sub),...pickUnique(errors,3,used,sub),...pickUnique(unseen,3,used,sub),...pickUnique(spaced,2,used,sub),...pickUnique(challenge,1,used,sub)];if(mission.length<15)mission.push(...pickUnique(base.sort((a,b)=>a.rand-b.rand),15-mission.length,used,sub));mission=mission.slice(0,15);idx=0;answers={}}
async function createSession(){buildMission();const ids=mission.map(q=>q.id);const r=await sb.from('practice_sessions').insert({student_id:studentId,game:GAME,question_ids:ids,current_index:0,last_activity_at:new Date().toISOString()}).select('id').single();if(r.error)throw r.error;sessionId=r.data.id}
async function resumeOrCreate(){const cutoff=new Date(Date.now()-12*60*60*1000).toISOString();let r=await sb.from('practice_sessions').select('id,question_ids,current_index,started_at').eq('student_id',studentId).eq('game',GAME).is('completed_at',null).gte('started_at',cutoff).not('question_ids','is',null).order('started_at',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data){await createSession();return}sessionId=r.data.id;mission=(r.data.question_ids||[]).map(byId).filter(Boolean);idx=Math.min(r.data.current_index||0,Math.max(0,mission.length-1));r=await sb.from('attempts').select('question_id,submitted_answer,is_correct').eq('session_id',sessionId);if(r.error)throw r.error;(r.data||[]).forEach(a=>answers[a.question_id]={submitted:a.submitted_answer,correct:a.is_correct});if(mission.length!==15)await createSession()}
function render(){const q=mission[idx];if(!q)return;$('title').textContent=`密碼機 ${idx+1} / ${mission.length}`;$('subtitle').textContent=`${STUDENT} 專屬：40%弱項、20%錯題、20%新題、13%重溫、7%挑戰`;$('bar').style.width=`${idx/mission.length*100}%`;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');const a=answers[q.id];let h=`<article class="question"><div class="meta">${q.topic} · ${q.skill} / ${q.sub_skill} · 難度 ${q.difficulty}</div><div class="q">${idx+1}. ${q.question_text}</div>`;if(q.question_type==='fill'){h+=`<input id="fillAnswer" class="input" autocomplete="off" placeholder="輸入英文答案" ${a?'disabled':''} value="${a?.submitted||''}"><div style="margin-top:9px"><button class="btn" type="button" onclick="submitFill()" ${a?'disabled':''}>提交答案</button></div>`}else{h+='<div class="options">';(q.options||[]).forEach(o=>{let c='option';if(a){if(norm(o)===norm(q.correct_answer))c+=' correct';else if(norm(o)===norm(a.submitted))c+=' wrong'}h+=`<button type="button" class="${c}" onclick='choose(${JSON.stringify(o)})' ${a?'disabled':''}>${o}</button>`});h+='</div>'}if(a)h+=`<div class="explain">${a.correct?'✅ 密碼破譯成功':'❌ 線索未對上'} · ${q.explanation}</div>`;h+='</article>';$('quiz').innerHTML=h;$('prevBtn').disabled=idx===0;$('nextBtn').textContent=idx===mission.length-1?'完成任務 🏁':'下一題 ➡';$('nextBtn').disabled=!a}
function submitFill(){const v=$('fillAnswer')?.value.trim();if(v)choose(v)}
async function choose(submitted){const q=mission[idx];if(answers[q.id])return;const correct=norm(submitted)===norm(q.correct_answer),raw=Date.now()-openedAt,effective=Math.min(raw,120000),valid=raw<=120000;answers[q.id]={submitted,correct};render();status('☁️ 正在保存…');const r=await sb.from('attempts').insert({student_id:studentId,session_id:sessionId,question_id:q.id,submitted_answer:submitted,correct_answer:q.correct_answer,is_correct:correct,response_time_ms:effective,raw_response_time_ms:raw,effective_response_time_ms:effective,response_time_valid:valid,hint_used:false,attempt_number:1,topic:q.topic,skill:q.skill,sub_skill:q.sub_skill,difficulty:q.difficulty});if(r.error){console.error(r.error);status('⚠️ 保存失敗','bad')}else{history.unshift({question_id:q.id,is_correct:correct,skill:q.skill,sub_skill:q.sub_skill,answered_at:new Date().toISOString()});summarize();status('✅ 作答已保存','good')}}
async function move(next){idx=next;openedAt=Date.now();await sb.from('practice_sessions').update({current_index:idx,last_activity_at:new Date().toISOString()}).eq('id',sessionId);render()}
async function finish(){const score=Object.values(answers).filter(x=>x.correct).length;$('bar').style.width='100%';$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<div class="score">${score}/15</div><h2>${score>=12?'逃生大門已開啟！':'下一輪會繼續補強弱項'}</h2><button class="btn" type="button" onclick="startNew()">開始下一輪</button>`;$('nextBtn').disabled=true;$('prevBtn').disabled=true;await sb.from('practice_sessions').update({completed_at:new Date().toISOString(),total_questions:15,correct_count:score,current_index:14,last_activity_at:new Date().toISOString()}).eq('id',sessionId)}
async function startNew(){try{await createSession();openedAt=Date.now();render()}catch(e){console.error(e);status('⚠️ 無法建立任務','bad')}}
async function init(){try{sb=window.supabase.createClient(SB_URL,SB_KEY);let r=await sb.from('students').select('id').ilike('name',STUDENT).limit(1).maybeSingle();if(r.error||!r.data)throw r.error||new Error(`找不到玩家 ${STUDENT}`);studentId=r.data.id;r=await sb.from('questions').select('id,topic,skill,sub_skill,difficulty,question_type,question_text,options,correct_answer,explanation').eq('active',true);if(r.error)throw r.error;BANK=(r.data||[]).filter(q=>q.question_text&&q.correct_answer&&q.explanation&&(q.question_type==='fill'||Array.isArray(q.options)));r=await sb.from('attempts').select('question_id,is_correct,skill,sub_skill,answered_at').eq('student_id',studentId).order('answered_at',{ascending:false}).limit(500);if(r.error)throw r.error;history=r.data||[];summarize();await resumeOrCreate();render();status('✅ Adaptive v2.2 已連線','good')}catch(e){console.error(e);status('⚠️ 連線失敗','bad');$('title').textContent='未能建立任務';$('subtitle').textContent=e?.message||'請檢查設定'}}
$('prevBtn').addEventListener('click',()=>{if(idx>0)move(idx-1)});$('nextBtn').addEventListener('click',()=>{if(!answers[mission[idx]?.id])return;if(idx<mission.length-1)move(idx+1);else finish()});$('newBtn').addEventListener('click',()=>{if(confirm('開始新任務？目前未完成任務會保留喺資料庫。'))startNew()});init();
</script></body></html>
