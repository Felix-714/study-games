10px 14px;border-radius:9px;cursor:pointer;font-weight:700}.btn.secondary{background:#151c26;border-color:#46536a;color:#d8e0ec}.btn:disabled{opacity:.35}.assist{justify-content:flex-start;flex-wrap:wrap;margin:10px 0}.explain{margin-top:12px;color:#d9d0be;line-height:1.65;border-top:1px solid #354050;padding-top:10px}.status{position:fixed;right:10px;bottom:10px;background:#111822;border:1px solid #566174;padding:8px;border-radius:8px;font-size:.76rem}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:20}.modal.show{display:grid}.modalbox{max-width:540px;width:100%;background:#121a24;border:1px solid #80683d;border-radius:15px;padding:18px}.modalbox h2,.score{color:var(--g)}.score{font-size:3rem;font-weight:900}.hidden{display:none}.result{text-align:center}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.top,.mission{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section class="hero"><div class="top"><a href="../">← 切換玩家</a><strong id="player"></strong></div><h1>🕯️ 莊園英文逃生</h1><p>Adaptive v2.6.2 Production · 15題 · 防重複 · 查字 · Voice</p><div class="stats"><div class="stat"><b id="attempts">–</b>歷史作答</div><div class="stat"><b id="accuracy">–</b>正確率</div><div class="stat"><b id="independent">–</b>獨立答啱</div><div class="stat"><b id="lookupLeft">–</b>查字餘額</div><div class="stat"><b id="bank">–</b>題庫</div></div></section><section class="panel"><div class="mission"><div><h2 id="title">載入中…</h2><div id="subtitle" class="meta"></div></div><button id="newBtn" class="btn secondary">開始新任務</button></div><div class="assist"><select id="voice" class="select"></select><button id="testVoice" class="btn secondary">測試聲音</button></div><div class="progress"><div id="bar" class="bar"></div></div><div id="quiz"></div><div id="result" class="result hidden"></div><div class="actions"><button id="prev" class="btn secondary">← 上一題</button><button id="next" class="btn">下一題 →</button></div>< <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://wxusktzdvpqxhxpyondx.supabase.co',SUPABASE_KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM',DICT='https://api.dictionaryapi.dev/api/v2/entries/en/';
const USERS=['Chelsea','Felix','Rachel','Savanna'],qp=new URLSearchParams(location.search),STUDENT=USERS.includes(qp.get('student'))?qp.get('student'):(localStorage.getItem('studyGamesUser')||'Chelsea');localStorage.setItem('studyGamesUser',STUDENT);
let sb,studentId,grade=6,course=null,scope=[1,2,3,4],BANK=[],history=[],recentSessionIds=new Set(),recentStems=new Set(),mission=[],idx=0,answers={},sessionId,openedAt,lookupLimit=3,lookupUsed=0,qLookups={},qAudio={},voices=[],voiceURI=localStorage.getItem('studyGamesVoice')||'';const $=id=>document.getElementById(id),norm=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,' '),stem=t=>norm(t).replace(/_+/g,'_').replace(/[“”"'.,!?;:()]/g,'').replace(/\b(the|a|an)\b/g,'').replace(/\s+/g,' ').trim();$('player').textContent=`玩家：${STUDENT}`;
function status(t){$('cloud').textContent=t}function summarize(){const c=history.filter(x=>x.is_correct).length,i=history.filter(x=>x.is_correct&&x.assistance_level==='independent').length;$('attempts').textContent=history.length;$('accuracy').textContent=history.length?Math.round(c/history.length*100)+'%':'新';$('independent').textContent=history.length?Math.round(i/history.length*100)+'%':'新';$('lookupLeft').textContent=`${lookupLimit-lookupUsed}/${lookupLimit}`;$('bank').textContent=BANK.length}

function linked(t){return String(t).replace(/\b([A-Za-z][A-Za-z'-]{2,})\b/g,`<button class="word" data-word="$1">$1</button>`)}async function lookup(word){word=word.toLowerCase();if(lookupUsed>=lookupLimit)return alert('本輪查字次數已用完');let d=null,src='Study Games';let r=await sb.from('vocabulary_definitions').select('*').eq('word',word).maybeSingle();if(r.data)d={word,pos:r.data.part_of_speech,def:r.data.simple_english,zh:r.data.chinese_meaning,ex:r.data.example_sentence};if(!d){try{const x=await fetch(DICT+word),j=await x.json(),e=j[0],m=e.meanings[0],z=m.definitions[0];d={word:e.word,pos:m.partOfSpeech,def:z.definition,ex:z.example,phon:e.phonetic};src='Free Dictionary API'}catch{return alert('暫時搵唔到呢個字，唔扣次數')}}lookupUsed++;qLookups[mission[idx].id]??=[];qLookups[mission[idx].id].push(word);summarize();$('definition').innerHTML=`<h2>${d.word} <small>${d.pos||''}</small></h2>${d.phon?`<p>/${d.phon}/</p>`:''}${d.zh?`<p>中文：${d.zh}</p>`:''}<p>${d.def}</p>${d.ex?`<p>Example: ${d.ex}</p>`:''}<button class="btn" onclick="speak('${word}',.8)">🔊 發音</button><p>${src} · 剩餘${lookupLimit-lookupUsed}次</p>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function chooseFrom(pool,n,used,stems,skills){const out=[];for(const q of pool){const sk=q.sub_skill_group||q.sub_skill,key=q.stem_key;if(out.length>=n)break;if(used.has(q.id)||stems.has(key)||(skills[sk]||0)>=3)continue;used.add(q.id);stems.add(key);skills[sk]=(skills[sk]||0)+1;out.push(q)}return out}
function buildMission(){const used=new Set(),stems=new Set(),skills={},maps={};history.forEach(x=>{const k=x.sub_skill_group||x.sub_skill;maps[k]??={n:0,c:0};maps[k].n++;if(x.is_correct)maps[k].c++});const base=BANK.map(q=>({...q,stem_key:stem(q.question_text),score:Math.random()}));const allowed=base.filter(q=>!recentSessionIds.has(q.id)&&!recentStems.has(q.stem_key));const current=allowed.filter(q=>(q.maps||[]).some(m=>m.course_id===course?.id&&scope.includes(m.chapter))).sort((a,b)=>a.score-b.score);const errors=allowed.filter(q=>history.some(h=>h.question_id===q.id&&!h.is_correct)).sort((a,b)=>a.score-b.score);const foundation=allowed.filter(q=>q.primary_level<grade).sort((a,b)=>a.score-b.score);const skillsPool=allowed.filter(q=>q.skill==='Reading'||q.skill==='Writing').sort((a,b)=>a.score-b.score);const spaced=base.filter(q=>!recentSessionIds.has(q.id)&&!recentStems.has(q.stem_key)).sort((a,b)=>a.score-b.score);mission=[...chooseFrom(current,8,used,stems,skills),...chooseFrom(errors,3,used,stems,skills),...chooseFrom(foundation,2,used,stems,skills),...chooseFrom(skillsPool,1,used,stems,skills),...chooseFrom(spaced,1,used,stems,skills)];for(const window of [50,30,20,0]){if(mission.length>=15)break;const blocked=new Set(history.slice(0,window).map(x=>x.question_id));mission.push(...chooseFrom(base.filter(q=>!blocked.has(q.id)).sort((a,b)=>a.score-b.score),15-mission.length,used,stems,skills))}mission=mission.slice(0,15);idx=0;answers={};lookupUsed=0;qLookups={};qAudio={}}
function render(){const q=mission[idx];if(!q)return;const a=answers[q.id];$('title').textContent=`密碼機 ${idx+1}/15`;$('subtitle').textContent=`${course?.book_level||'P'+grade} · 防重複 · 查字${lookupLimit-lookupUsed}/${lookupLimit}`;$('bar').style.width=`${idx/15*100}%`;let h=`<div class="question"><div class="meta"><span class="label">P${q.primary_level}</span><span class="label">${q.skill}</span><span class="label">難度${q.difficulty}</span></div><div class="assist"><button class="btn secondary" onclick="speakQuestion()">🔊 播放題目 ${qAudio[q.id]||0}/2</button></div><div class="q">${linked(q.question_text)}</div>`;if(q.question_type==='fill')h+=`<input id="fill" class="input" ${a?'disabled':''} value="${a?.submitted||''}"><button class="btn" onclick="submitFill()" ${a?'disabled':''}>提交</button>`;else{h+='<div class="options">';q.options.forEach(o=>{let c='option';if(a)c+=norm(o)===norm(q.correct_answer)?' correct':norm(o)===norm(a.submitted)?' wrong':'';h+=`<button class="${c}" data-answer="${encodeURIComponent(o)}" ${a?'disabled':''}>${o}</button>`});h+='</div>'}if(a)h+=`<div class="explain">${a.correct?'✅':'❌'} · ${a.level}<br>${q.explanation}</div>`;h+='</div>';$('quiz').innerHTML=h;$('quiz').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(decodeURIComponent(b.dataset.answer)));$('quiz').querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>lookup(b.dataset.word));$('prev').disabled=idx===0;$('next').disabled=!a;$('next').textContent=idx===14?'完成任務':'下一題 →'}function submitFill(){const v=$('fill')?.value.trim();if(v)choose(v)}
async function choose(v){const q=mission[idx];if(answers[q.id])return;const correct=norm(v)===norm(q.correct_answer),lc=(qLookups[q.id]||[]).length,ac=qAudio[q.id]||0,level=!lc&&ac<=1?'independent':lc<=1?'assisted':'high_support';answers[q.id]={submitted:v,correct,level};render();const r=await sb.from('attempts').insert({student_id:studentId,session_id:sessionId,question_id:q.id,submitted_answer:v,correct_answer:q.correct_answer,is_correct:correct,response_time_ms:Math.min(Date.now()-openedAt,120000),lookup_count:lc,lookup_words:qLookups[q.id]||[],audio_play_count:ac,assistance_level:level,mastery_weight:correct?(level==='independent'?1:level==='assisted'?.75:.5):0,topic:q.topic,skill:q.skill,sub_skill:q.sub_skill,difficulty:q.difficulty});if(r.error)return status('⚠️ '+r.error.message);history.unshift({question_id:q.id,is_correct:correct,assistance_level:level,sub_skill:q.sub_skill,sub_skill_group:q.sub_skill_group});summarize();status('✅ 已保存')}
async function createSession(){buildMission();if(mission.length<15)throw new Error('防重複後不足15題，請擴充題庫');const r=await sb.from('practice_sessions').insert({student_id:studentId,game:'adaptive-v2.6.2-production',question_ids:mission.map(q=>q.id),current_index:0,last_activity_at:new Date().toISOString()}).select('id').single();if(r.error)throw r.error;sessionId=r.data.id;openedAt=Date.now();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}async function finish(){const score=Object.values(answers).filter(x=>x.correct).length,ind=Object.values(answers).filter(x=>x.correct&&x.level==='independent').length;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<div class="score">${score}/15</div><h2>獨立答啱 ${ind}/15</h2><button class="btn" onclick="createSession()">下一輪</button>`;await sb.from('practice_sessions').update({completed_at:new Date().toISOString(),total_questions:15,correct_count:score,current_index:14}).eq('id',sessionId)}
async function init(){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let r=await sb.from('students').select('id,current_primary_level').ilike('name',STUDENT).single();studentId=r.data.id;grade=r.data.current_primary_level||6;lookupLimit=grade<=4?4:3;r=await sb.from('student_curriculum').select('exam_chapters,curriculum_courses(id,book_level)').eq('student_id',studentId).eq('is_current',true).limit(1).maybeSingle();course=r.data?.curriculum_courses||null;scope=r.data?.exam_chapters||[1,2,3,4];r=await sb.from('questions').select('id,topic,skill,sub_skill,sub_skill_group,primary_level,difficulty,question_type,question_text,options,correct_answer,explanation,audio_text,audio_speed').eq('active',true).lte('primary_level',grade);BANK=(r.data||[]).filter(q=>q.question_text&&q.correct_answer&&(q.question_type==='fill'||Array.isArray(q.options)));if(course){r=await sb.from('question_curriculum_map').select('question_id,curriculum_targets(curriculum_units(chapter,course_id))');const mm={};(r.data||[]).forEach(x=>{const u=x.curriculum_targets?.curriculum_units;if(u){mm[x.question_id]??=[];mm[x.question_id].push({course_id:u.course_id,chapter:u.chapter})}});BANK.forEach(q=>q.maps=mm[q.id]||[])}r=await sb.from('attempts').select('question_id,is_correct,assistance_level,sub_skill,questions(sub_skill_group,question_text)').eq('student_id',studentId).order('answered_at',{ascending:false}).limit(700);history=(r.data||[]).map(x=>({...x,sub_skill_group:x.questions?.sub_skill_group,stem_key:stem(x.questions?.question_text||'')}));r=await sb.from('practice_sessions').select('question_ids').eq('student_id',studentId).not('completed_at','is',null).order('completed_at',{ascending:false}).limit(3);(r.data||[]).flatMap(x=>x.question_ids||[]).forEach(id=>recentSessionIds.add(id));BANK.filter(q=>recentSessionIds.has(q.id)).forEach(q=>recentStems.add(stem(q.question_text)));summarize();await createSession();status('✅ v2.6.2 已連線')}catch(e){console.error(e);status('⚠️ '+e.message);$('title').textContent='載入失敗'}}$('testVoice').onclick=()=>speak('Hello. Your English voice is ready.');$('prev').onclick=()=>{if(idx){idx--;openedAt=Date.now();render()}};$('next').onclick=()=>{if(!answers[mission[idx]?.id])return;idx<14?(idx++,openedAt=Date.now(),render()):finish()};$('newBtn').onclick=()=>confirm('開始新任務？')&&createSession();init();
