<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Challenge — 第五人格篇</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#ccc;font-family:Arial,"Noto Sans HK",sans-serif;line-height:1.55}.app{max-width:820px;margin:auto;padding:16px}.header{text-align:center;padding:30px 0 15px}.header h1{margin:0;color:#eee;letter-spacing:3px;font-size:2rem}.subtitle{color:#8d5b41;font-size:.85rem}.progress{height:11px;background:#1c1c1c;border:1px solid #333;margin:18px 0 5px}.bar{height:100%;background:linear-gradient(90deg,#568d34,#9b1515);transition:.3s}.small{text-align:center;color:#777;font-size:.78rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;margin:18px 0}.level{background:#111;border:1px solid #292929;color:#777;padding:10px 5px;cursor:pointer}.level.active{border-color:#aaa;color:#fff}.level.locked{opacity:.28;cursor:not-allowed}.level .ico{display:block;font-size:1.5rem}.card{border:1px solid #292929;background:#0d0d0d;padding:22px}.question{background:#111;border-left:3px solid #333;padding:13px;margin:12px 0}.q{font-weight:700;color:#e3e3e3;margin-bottom:8px}.options{display:grid;gap:6px}.options label{border:1px solid #252525;background:#151515;padding:8px;cursor:pointer}.options label:hover{border-color:#555}.fill{width:100%;padding:9px;background:#151515;border:1px solid #333;color:#eee}.result{margin-top:8px;font-size:.85rem}.correct{color:#72c472}.wrong{color:#ff7770}.explain{color:#999;border-left:2px solid #555;padding-left:9px;margin-top:6px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.btn{padding:10px 16px;background:#1a1a1a;border:1px solid #444;color:#ddd;cursor:pointer}.btn:disabled{opacity:.3}.status{position:fixed;right:10px;bottom:10px;z-index:9;padding:7px 10px;border-radius:6px;background:#151515;border:1px solid #444;font-size:.75rem}.ok{color:#72c472}.warn{color:#ff8a80}.saving{color:#ffd180}@media(max-width:520px){.app{padding:9px}.card{padding:14px}.header h1{font-size:1.45rem}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head><body><div id="app" class="app"></div><div id="cloud" class="status">☁️ 正在連接學習紀錄…</div>
<script>
const levels=[{"icon": "🎭", "name": "職業配對", "topic": "Jobs", "difficulty": 1, "questions": [{"type": "mcq", "skill": "Vocabulary", "sub": "Job duties", "q": "Lucky wants to help people. Which job is best for him?", "options": ["pilot — fly planes", "social worker — help people in need", "firefighter — rescue people from fires"], "answer": 1, "explain": "Social worker 社工 — help people in need（幫有需要嘅人）"}, {"type": "mcq", "skill": "Vocabulary", "sub": "Job duties", "q": "What does a police officer do?", "options": ["interview people", "speak for people in court", "protect people and fight crime"], "answer": 2, "explain": "Police officer 警察 — protect people and fight crime"}, {"type": "mcq", "skill": "Vocabulary", "sub": "Job duties", "q": "Match: A lawyer's duty is to ______.", "options": ["design buildings", "speak for people in court", "cure sick animals"], "answer": 1, "explain": "Lawyer 律師 — speak for people in court"}, {"type": "mcq", "skill": "Vocabulary", "sub": "Job duties", "q": "What does an astronaut do?", "options": ["explore space", "run a company", "design clothes"], "answer": 0, "explain": "Astronaut 太空人 — explore space"}, {"type": "fill", "skill": "Vocabulary", "sub": "Jobs vocabulary", "q": "A vet is a doctor for ______.", "answer": "animals", "explain": "Vet 獸醫 — cure sick animals"}]}, {"icon": "📖", "name": "夢想職業", "topic": "Dream Jobs", "difficulty": 1, "questions": [{"type": "mcq", "skill": "Reading", "sub": "Question meaning", "q": "What does ‘What do you want to be when you grow up?’ mean?", "options": ["What do you want to do now?", "What do you want to be when you are older?", "What do you like doing?"], "answer": 1, "explain": "意思係：你大個想做咩？"}, {"type": "mcq", "skill": "Vocabulary", "sub": "Job duties", "q": "I want to be a fashion designer because I love ______.", "options": ["designing clothes", "flying planes", "rescuing people"], "answer": 0, "explain": "Fashion designers design clothes."}, {"type": "fill", "skill": "Vocabulary", "sub": "Job duties", "q": "Complete: I want to be a pilot. I will ______ planes.", "answer": "fly", "explain": "Pilots fly planes."}, {"type": "mcq", "skill": "Vocabulary", "sub": "Job duties", "q": "What does an architect do?", "options": ["design buildings", "design clothes", "design computer programs"], "answer": 0, "explain": "Architect 建築師 — design buildings"}, {"type": "mcq", "skill": "Grammar", "sub": "Third-person singular", "q": "Which sentence is correct?", "options": ["She want to be a doctor.", "She wants to be a doctor.", "She wanting to be a doctor."], "answer": 1, "explain": "He/She/It 要用 wants（第三人稱單數）"}]}, {"icon": "🎯", "name": "工作要求", "topic": "Job Requirements", "difficulty": 2, "questions": [{"type": "mcq", "skill": "Vocabulary", "sub": "Personality adjectives", "q": "What do nurses need to be?", "options": ["caring — care for and support others", "talkative — enjoy talking", "good-looking — attractive"], "answer": 0, "explain": "Nurses need to be caring."}, {"type": "mcq", "skill": "Vocabulary", "sub": "Personality adjectives", "q": "A teacher needs to be ______. This means not get angry easily.", "options": ["patient", "outgoing", "creative"], "answer": 0, "explain": "Patient = 有耐性"}, {"type": "fill", "skill": "Vocabulary", "sub": "Personality adjectives", "q": "Flight attendants need to be ______. (pay attention to others)", "answer": "attentive", "explain": "Attentive = 細心、留意人需要"}, {"type": "mcq", "skill": "Grammar", "sub": "If clauses", "q": "What does if mean in: If I become a vet, I will help animals?", "options": ["because", "if", "so"], "answer": 1, "explain": "If = 如果"}, {"type": "mcq", "skill": "Grammar", "sub": "So that", "q": "I practise every day ______ I can improve.", "options": ["because", "so that", "if"], "answer": 1, "explain": "So that 表示目的：為咗可以進步"}]}, {"icon": "🧩", "name": "特別職業", "topic": "Special Jobs", "difficulty": 2, "questions": [{"type": "mcq", "skill": "Reading", "sub": "Job requirements", "q": "What does a pet cafe owner need to be?", "options": ["attentive and caring", "only good-looking", "talkative and outgoing"], "answer": 0, "explain": "Pet cafe owners need to be attentive and caring."}, {"type": "mcq", "skill": "Vocabulary", "sub": "Personality adjectives", "q": "A food vlogger needs to be ______ to come up with new ideas.", "options": ["hard-working", "creative", "patient"], "answer": 1, "explain": "Creative = 有創意"}, {"type": "fill", "skill": "Grammar", "sub": "Need to be", "q": "Pet cafe owners ______ to be attentive and caring.", "answer": "need", "explain": "Need to be + adjective = 需要係……"}, {"type": "mcq", "skill": "Grammar", "sub": "So that", "q": "What does so that mean?", "options": ["because", "in order to / 為咗", "although"], "answer": 1, "explain": "So that = 為咗、以便"}, {"type": "fill", "skill": "Grammar", "sub": "So that", "q": "I want to be a social worker ______ I can help people in need.", "answer": "so that", "explain": "So that 表示目的"}]}, {"icon": "🌪️", "name": "天災救援", "topic": "Natural Disasters", "difficulty": 2, "questions": [{"type": "mcq", "skill": "Vocabulary", "sub": "Natural disasters", "q": "Which of these is a natural disaster?", "options": ["typhoon", "birthday party", "school exam"], "answer": 0, "explain": "Typhoon（颱風）is a natural disaster."}, {"type": "mcq", "skill": "Grammar", "sub": "Present perfect", "q": "The typhoon ______ (hit) the Philippines.", "options": ["has hitted", "has hit", "have hit"], "answer": 1, "explain": "The typhoon has hit the Philippines."}, {"type": "fill", "skill": "Grammar", "sub": "Present perfect", "q": "Drought ______ (affect) many countries this year.", "answer": "has affected", "explain": "Drought has affected many countries this year."}, {"type": "mcq", "skill": "Grammar", "sub": "Since", "q": "What can since mean?", "options": ["because / from a time", "so", "although"], "answer": 0, "explain": "Since 可表示因為或自從"}, {"type": "mcq", "skill": "Grammar", "sub": "Either or", "q": "Which sentence uses either...or correctly?", "options": ["We can either help by donating money or volunteering.", "We either can help by donating money or volunteering.", "Either we can help by donating money or volunteering."], "answer": 0, "explain": "結構：either + A + or + B"}]}, {"icon": "💬", "name": "呼籲行動", "topic": "Call to Action", "difficulty": 3, "questions": [{"type": "mcq", "skill": "Grammar", "sub": "Shall we", "q": "What is Shall we used for?", "options": ["making suggestions", "talking about the past", "describing people"], "answer": 0, "explain": "Shall we...? 用嚟提出建議"}, {"type": "mcq", "skill": "Grammar", "sub": "Neither nor", "q": "Neither the government ______ the charity can solve this alone.", "options": ["or", "nor", "and"], "answer": 1, "explain": "Neither...nor = 兩者都唔……"}, {"type": "fill", "skill": "Grammar", "sub": "Too adjective", "q": "The situation is ______ difficult for us. (too / so / very)", "answer": "too", "explain": "Too + adjective = 太……"}, {"type": "mcq", "skill": "Writing", "sub": "Speech opening", "q": "How should you start a speech asking for help?", "options": ["Good morning everyone. I'm here to ask for your help...", "The end thank you.", "Once upon a time..."], "answer": 0, "explain": "先打招呼，再講目的"}, {"type": "fill", "skill": "Grammar", "sub": "Either or", "q": "We can ______ donate money ______ volunteer. (either...or)", "answer": "either or", "explain": "We can either donate money or volunteer."}]}, {"icon": "🏆", "name": "最終逃脫", "topic": "Final Review", "difficulty": 3, "questions": [{"type": "mcq", "skill": "Vocabulary", "sub": "Jobs vocabulary", "q": "A person who flies planes is a ______.", "options": ["flight attendant", "pilot", "astronaut"], "answer": 1, "explain": "Pilot 機師 — flies planes"}, {"type": "mcq", "skill": "Vocabulary", "sub": "Personality adjectives", "q": "A social worker needs to be ______.", "options": ["creative", "calm", "caring"], "answer": 2, "explain": "Social workers need to be caring."}, {"type": "fill", "skill": "Grammar", "sub": "Present perfect", "q": "The earthquake ______ (destroy) many homes.", "answer": "has destroyed", "explain": "The earthquake has destroyed many homes."}, {"type": "mcq", "skill": "Grammar", "sub": "Because", "q": "I want to be a vet ______ I love animals.", "options": ["because", "so that", "if"], "answer": 0, "explain": "Because 表示原因"}, {"type": "fill", "skill": "Vocabulary", "sub": "Personality adjectives", "q": "He is very ______. He does not get angry easily.", "answer": "patient", "explain": "Patient = 有耐性"}]}];
const SB_URL='https://wxusktzdvpqxhxpyondx.supabase.co';
const SB_KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM';
const STUDENT='大女',GAME='english-challenge-idv';
let state={currentLevel:0,completed:{},stars:{},answers:{}};
let sb=null,studentId=null,sessionId=null,cloudReady=false,openedAt=Date.now();
function loadState(){try{const s=localStorage.getItem('engChallengeIDV');if(s)state=JSON.parse(s)}catch(e){console.warn(e)}}
function saveState(){localStorage.setItem('engChallengeIDV',JSON.stringify(state))}
function qid(li,qi){return `eng_ch${li+1}_q${String(qi+1).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isCorrect(q,a){return q.type==='mcq'?Number(a)===q.answer:String(a??'').trim().toLowerCase()===String(q.answer).trim().toLowerCase()}
function render(){const total=levels.reduce((n,l)=>n+l.questions.length,0);const done=Object.values(state.answers).filter(v=>v!==''&&v!==undefined).length;const li=state.currentLevel,l=levels[li];let h=`<div class="header"><h1>🔦 English Challenge</h1><div class="subtitle">第Ⅴ人格 · 英文特訓</div></div><div class="progress"><div class="bar" style="width:${Math.round(done/total*100)}%"></div></div><div class="small">破譯 ${done} / ${total} 條線索 · 解鎖 ${Object.keys(state.completed).length} / 7 章</div><div class="grid">`;
levels.forEach((x,i)=>{const unlocked=i===0||state.completed[i-1]||state.completed[i];h+=`<button class="level ${i===li?'active':''} ${unlocked?'':'locked'}" ${unlocked?`onclick="go(${i})"`:'disabled'}><span class="ico">${x.icon}</span>${x.name}<div>${'★'.repeat(state.stars[i]||0)}${'☆'.repeat(5-(state.stars[i]||0))}</div></button>`});h+=`</div><div class="card"><h2>${l.icon} Chapter ${li+1}：${l.name}</h2><div class="small">答啱 4/5 就過關</div>`;
l.questions.forEach((q,qi)=>{const key=`${li}_${qi}`,a=state.answers[key],checked=a!==undefined&&a!=='';h+=`<div class="question"><div class="q">${qi+1}. ${esc(q.q)}</div>`;if(q.type==='mcq'){h+='<div class="options">';q.options.forEach((o,oi)=>h+=`<label><input type="radio" name="${key}" ${Number(a)===oi?'checked':''} onchange="answer(${li},${qi},${oi})"> ${esc(o)}</label>`);h+='</div>'}else h+=`<input class="fill" value="${esc(a||'')}" placeholder="輸入英文答案..." onchange="answer(${li},${qi},this.value)">`;if(checked)h+=`<div class="result ${isCorrect(q,a)?'correct':'wrong'}">${isCorrect(q,a)?'✅ 線索破譯成功！':'❌ 線索錯誤，再試試'}<div class="explain">💡 ${esc(q.explain)}</div></div>`;h+='</div>'});
const score=l.questions.filter((q,qi)=>isCorrect(q,state.answers[`${li}_${qi}`])).length;h+=`<div class="actions"><button class="btn" onclick="prev()" ${li===0?'disabled':''}>⬅ 上章</button>${score>=4?'<button class="btn" onclick="complete()">✅ 逃脫成功！下章 ➡</button>':'<button class="btn" onclick="render()">✓ 檢查線索</button>'}</div></div><div style="text-align:center;margin:12px"><button class="btn" onclick="resetAll()">🔄 重置進度</button></div>`;document.getElementById('app').innerHTML=h}
async function answer(li,qi,val){state.answers[`${li}_${qi}`]=val;saveState();render();if(cloudReady)await saveAttempt(li,qi,val)}
function go(i){state.currentLevel=i;openedAt=Date.now();saveState();render()}
function prev(){if(state.currentLevel>0)go(state.currentLevel-1)}
function complete(){const li=state.currentLevel,l=levels[li],score=l.questions.filter((q,qi)=>isCorrect(q,state.answers[`${li}_${qi}`])).length;state.stars[li]=score;state.completed[li]=true;if(li<6)state.currentLevel++;openedAt=Date.now();saveState();render()}
function resetAll(){if(confirm('確定重置本機遊戲進度？雲端歷史紀錄不會刪除。')){state={currentLevel:0,completed:{},stars:{},answers:{}};saveState();render()}}
function cloudStatus(t,c=''){const e=document.getElementById('cloud');e.textContent=t;e.className='status '+c}
function loadSupabase(){return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=()=>rej(new Error('Supabase library load failed'));document.head.appendChild(s)})}
async function initCloud(){try{await loadSupabase();sb=window.supabase.createClient(SB_URL,SB_KEY);let r=await sb.from('students').select('id').eq('name',STUDENT).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('找不到學生：'+STUDENT);studentId=r.data.id;sessionId=sessionStorage.getItem('studyGamesEnglishSessionId');if(!sessionId){r=await sb.from('practice_sessions').insert({student_id:studentId,game:GAME}).select('id').single();if(r.error)throw r.error;sessionId=r.data.id;sessionStorage.setItem('studyGamesEnglishSessionId',sessionId)}cloudReady=true;cloudStatus('✅ 學習紀錄已連線','ok')}catch(e){console.error(e);cloudStatus('⚠️ 雲端紀錄未連線，遊戲仍可使用','warn')}}
async function saveAttempt(li,qi,val){try{const q=levels[li].questions[qi];const submitted=q.type==='mcq'?q.options[Number(val)]:String(val).trim();const correct=q.type==='mcq'?q.options[q.answer]:String(q.answer);cloudStatus('☁️ 正在保存作答…','saving');const r=await sb.from('attempts').insert({student_id:studentId,session_id:sessionId,question_id:qid(li,qi),submitted_answer:submitted,correct_answer:correct,is_correct:isCorrect(q,val),response_time_ms:Math.max(0,Date.now()-openedAt),hint_used:false,attempt_number:1,topic:levels[li].topic,skill:q.skill,sub_skill:q.sub,difficulty:levels[li].difficulty});if(r.error)throw r.error;cloudStatus('✅ 作答已保存','ok')}catch(e){console.error(e);cloudStatus('⚠️ 雲端保存失敗，遊戲進度仍已保留','warn')}}
loadState();render();initCloud();
</script></body></html>
