<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>莊園英文逃生 · Adaptive v2.6</title><style>
:root{--gold:#d9b36c;--card:rgba(15,20,29,.94);--line:#4d5665;--text:#f0eadf;--muted:#b5b0a5;--good:#7ed19a;--bad:#ff8d86}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,"Noto Sans HK",sans-serif;background:#080b10 url('manor-background.png') center/cover fixed no-repeat;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:#07101bd8;z-index:-1}.wrap{max-width:980px;margin:auto;padding:16px}.hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 50px #0008}.hero,.panel{padding:20px}.top,.mission,.actions,.assist{display:flex;align-items:center;justify-content:space-between;gap:10px}.hero h1{color:var(--gold);margin:8px}.back{color:#dfd0ad;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.stat{background:#101620;border:1px solid #384254;border-radius:11px;padding:10px;text-align:center}.stat b{display:block;color:var(--gold);font-size:1.25rem}.panel{margin-top:14px}.progress{height:9px;background:#171d27;border:1px solid #414958;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#3e8f78,var(--gold),#6e2630)}.question{padding:16px;background:#111822;border-left:4px solid var(--gold);border-radius:8px}.meta{font-size:.78rem;color:#9eb0c8}.label{display:inline-block;border:1px solid #526078;border-radius:999px;padding:4px 8px;margin-right:5px}.q{font-weight:750;font-size:1.08rem;margin:13px 0;line-height:1.7}.word{border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;padding:0 1px;cursor:help;border-bottom:1px dotted #8fa3b8}.options{display:grid;gap:8px}.option,.input{width:100%;text-align:left;padding:11px;background:#17202c;border:1px solid #39475b;color:var(--text);border-radius:8px}.option{cursor:pointer}.option:hover{border-color:var(--gold)}.option.correct{background:#183929;border-color:var(--good)}.option.wrong{background:#462027;border-color:var(--bad)}.btn{border:1px solid #80683d;background:#322817;color:#f5dfb0;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}.btn.secondary{background:#151c26;border-color:#46536a;color:#d8e0ec}.btn:disabled{opacity:.35}.assist{justify-content:flex-start;flex-wrap:wrap;margin:10px 0}.pill{font-size:.82rem;color:#d8e0ec}.explain{margin-top:12px;color:#d9d0be;line-height:1.65;border-top:1px solid #354050;padding-top:10px}.status{position:fixed;right:10px;bottom:10px;background:#111822;border:1px solid #566174;padding:8px 11px;border-radius:8px;font-size:.76rem}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:20}.modal.show{display:grid}.modalbox{max-width:520px;width:100%;background:#121a24;border:1px solid #80683d;border-radius:15px;padding:18px;box-shadow:0 20px 60px #000}.modalbox h2{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}.hidden{display:none}.result{text-align:center}.score{font-size:3rem;color:var(--gold);font-weight:900}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.top,.mission{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section class="hero"><div class="top"><a class="back" href="../">← 切換玩家</a><strong id="player"></strong></div><h1>🕯️ 莊園英文逃生</h1><p>Adaptive v2.6 · 15題 · 限次查字 · Voice Listening · Assisted Mastery</p><div class="stats"><div class="stat"><b id="attempts">–</b>歷史作答</div><div class="stat"><b id="accuracy">–</b>正確率</div><div class="stat"><b id="independent">–</b>獨立答啱</div><div class="stat"><b id="lookupLeft">–</b>查字餘額</div><div class="stat"><b id="bank">–</b>題庫</div></div></section><section class="panel"><div class="mission"><div><h2 id="title">正在載入…</h2><div id="subtitle" class="meta"></div></div><button id="newBtn" class="btn secondary">開始新任務</button></div><div class="progress"><div id="bar" class="bar"></div></div><div id="quiz"></div><div id="result" class="result hidden"></div><div class="actions"><button id="prev" class="btn secondary">← 上一題</button><button id="next" class="btn">下一題 →</button></div></section></main><div id="cloud" class="status">☁️ 連接中…</div><div id="modal" class="modal"><div class="modalbox"><button class="btn secondary" style="float:right" onclick="closeModal()">關閉</button><div id="definition"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://wxusktzdvpqxhxpyondx.supabase.co',KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM',USERS=['Chelsea','Felix','Rachel','Savanna'];const qp=new URLSearchParams(location.search),STUDENT=USERS.includes(qp.get('student'))?qp.get('student'):(localStorage.getItem('studyGamesUser')||'Chelsea');localStorage.setItem('studyGamesUser',STUDENT);$('player').textContent=`玩家：${STUDENT}`;let sb,studentId,grade=6,BANK=[],history=[],mission=[],idx=0,answers={},sessionId,openedAt,lookupLimit=3,lookupUsed=0,qLookups={},qAudio={};function $(id){return document.getElementById(id)}const norm=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,' ');function st(t,c=''){$('cloud').textContent=t;$('cloud').className='status '+c}
function linked(text){return text.replace(/\b([A-Za-z][A-Za-z'-]{2,})\b/g,`<button class="word" onclick="lookup('$1')">$1</button>`)}
function summarize(){const c=history.filter(x=>x.is_correct).length,ind=history.filter(x=>x.is_correct&&x.assistance_level==='independent').length;$('attempts').textContent=history.length;$('accuracy').textContent=history.length?Math.round(c/history.length*100)+'%':'新';$('independent').textContent=history.length?Math.round(ind/history.length*100)+'%':'新';$('lookupLeft').textContent=`${lookupLimit-lookupUsed}/${lookupLimit}`;$('bank').textContent=BANK.length}
async function lookup(raw){const word=raw.toLowerCase().replace(/[^a-z'-]/g,'');if(!word)return;if(lookupUsed>=lookupLimit){alert('本輪查字次數已用完。試下用句子前後文推測意思。');return}const r=await sb.from('vocabulary_definitions').select('*').eq('word',word).maybeSingle();if(r.error||!r.data){$('definition').innerHTML=`<h2>${word}</h2><p>暫時未有呢個字嘅Exam-safe解釋，今次唔扣查字次數。</p>`;$('modal').classList.add('show');return}lookupUsed++;qLookups[mission[idx].id]??=[];if(!qLookups[mission[idx].id].includes(word))qLookups[mission[idx].id].push(word);summarize();$('definition').innerHTML=`<h2>${r.data.word} <small>${r.data.part_of_speech||''}</small></h2><p><b>中文：</b>${r.data.chinese_meaning}</p><p><b>Simple English：</b>${r.data.simple_english}</p><p><b>Example：</b>${r.data.example_sentence||''}</p><button class="btn" onclick="speak('${r.data.word}',0.8,true)">🔊 聽發音</button><p>本輪剩餘 ${lookupLimit-lookupUsed} 次</p>`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}function speak(text,rate=.9,pronunciation=false){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}const q=mission[idx];if(!pronunciation){const used=qAudio[q.id]||0,max=q.max_audio_plays||2;if(used>=max){alert(`每題最多播放 ${max} 次`);return}qAudio[q.id]=used+1;render()}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;speechSynthesis.speak(u)}
function pickQuestions(){const recent=new Set(history.slice(0,40).map(x=>x.question_id));mission=[...BANK].sort((a,b)=>(recent.has(a.id)?1:0)-(recent.has(b.id)?1:0)||Math.random()-.5).slice(0,15);idx=0;answers={};lookupUsed=0;qLookups={};qAudio={}}
function render(){const q=mission[idx];if(!q)return;const a=answers[q.id];$('title').textContent=`密碼機 ${idx+1} / 15`;$('subtitle').textContent=`P${grade} · 查字 ${lookupLimit-lookupUsed}/${lookupLimit} · Voice每題最多2次`;$('bar').style.width=`${idx/15*100}%`;let h=`<article class="question"><div class="meta"><span class="label">P${q.primary_level}</span><span class="label">${q.skill}</span><span class="label">難度 ${q.difficulty}</span></div><div class="assist"><button class="btn secondary" onclick="speak(${JSON.stringify(q.audio_text||q.question_text)},${q.audio_speed||.9})">🔊 播放題目 (${qAudio[q.id]||0}/${q.max_audio_plays||2})</button><span class="pill">點選題目英文詞語可查字</span></div><div class="q">${q.listening_script_hidden&&!a?'🎧 Listen and answer.':linked(q.question_text)}</div>`;if(q.question_type==='fill'){h+=`<input id="fill" class="input" ${a?'disabled':''} value="${a?.submitted||''}"><button class="btn" onclick="submitFill()" ${a?'disabled':''}>提交答案</button>`}else{h+='<div class="options">';(q.options||[]).forEach(o=>{let c='option';if(a)c+=norm(o)===norm(q.correct_answer)?' correct':norm(o)===norm(a.submitted)?' wrong':'';h+=`<button class="${c}" onclick='choose(${JSON.stringify(o)})' ${a?'disabled':''}>${o}</button>`});h+='</div>'}if(a)h+=`<div class="explain">${a.correct?'✅ 正確':'❌ 未對'} · 支援程度：${a.level}<br>${q.explanation}</div>`;h+='</article>';$('quiz').innerHTML=h;$('prev').disabled=idx===0;$('next').disabled=!a;$('next').textContent=idx===14?'完成任務':'下一題 →'}
function submitFill(){const v=$('fill')?.value.trim();if(v)choose(v)}async function choose(submitted){const q=mission[idx];if(answers[q.id])return;const correct=norm(submitted)===norm(q.correct_answer),lc=(qLookups[q.id]||[]).length,ac=qAudio[q.id]||0,level=lc===0&&ac<=1?'independent':lc<=1&&ac<=2?'assisted':'high_support',weight=correct?(level==='independent'?1:level==='assisted'?.75:.5):0;answers[q.id]={submitted,correct,level};render();const r=await sb.from('attempts').insert({student_id:studentId,session_id:sessionId,question_id:q.id,submitted_answer:submitted,correct_answer:q.correct_answer,is_correct:correct,response_time_ms:Math.min(Date.now()-openedAt,120000),lookup_count:lc,lookup_words:qLookups[q.id]||[],audio_play_count:ac,assistance_level:level,mastery_weight:weight,topic:q.topic,skill:q.skill,sub_skill:q.sub_skill,difficulty:q.difficulty});if(r.error){console.error(r.error);st('⚠️ 保存失敗','bad')}else{history.unshift({question_id:q.id,is_correct:correct,assistance_level:level});summarize();st('✅ 作答已保存','good')}}
async function createSession(){pickQuestions();const r=await sb.from('practice_sessions').insert({student_id:studentId,game:'adaptive-assistance-v2.6',question_ids:mission.map(x=>x.id),current_index:0,last_activity_at:new Date().toISOString()}).select('id').single();if(r.error)throw r.error;sessionId=r.data.id;openedAt=Date.now();render()}async function finish(){const score=Object.values(answers).filter(x=>x.correct).length,ind=Object.values(answers).filter(x=>x.correct&&x.level==='independent').length;$('quiz').innerHTML=`<div class="result"><div class="score">${score}/15</div><h2>獨立答啱：${ind}/15</h2><p>查字使用：${lookupUsed}/${lookupLimit}</p><button class="btn" onclick="createSession()">下一輪</button></div>`;await sb.from('practice_sessions').update({completed_at:new Date().toISOString(),total_questions:15,correct_count:score}).eq('id',sessionId)}
async function init(){try{sb=supabase.createClient(URL,KEY);let r=await sb.from('students').select('id,current_primary_level').ilike('name',STUDENT).maybeSingle();if(r.error||!r.data)throw r.error||new Error('找不到玩家');studentId=r.data.id;grade=r.data.current_primary_level||6;lookupLimit=grade<=4?4:3;r=await sb.from('questions').select('id,topic,skill,sub_skill,primary_level,difficulty,question_type,question_text,options,correct_answer,explanation,audio_text,audio_speed,max_audio_plays,dictionary_allowed,listening_script_hidden').eq('active',true).lte('primary_level',grade);if(r.error)throw r.error;BANK=(r.data||[]).filter(q=>q.question_text&&q.correct_answer&&(q.question_type==='fill'||Array.isArray(q.options)));r=await sb.from('attempts').select('question_id,is_correct,assistance_level').eq('student_id',studentId).order('answered_at',{ascending:false}).limit(700);history=r.data||[];summarize();await createSession();st('✅ Adaptive v2.6 已連線','good')}catch(e){console.error(e);st('⚠️ 請先執行v2.6 SQL','bad')}}$('prev').onclick=()=>{if(idx>0){idx--;openedAt=Date.now();render()}};$('next').onclick=()=>{if(!answers[mission[idx]?.id])return;if(idx<14){idx++;openedAt=Date.now();render()}else finish()};$('newBtn').onclick=()=>confirm('開始新任務？')&&createSession();init();
</script></body></html>
