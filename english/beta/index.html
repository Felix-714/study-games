<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v2.6 Connection Test</title><style>body{font-family:system-ui;background:#0b1018;color:#eee;padding:24px}.box{max-width:760px;margin:auto;background:#111923;border:1px solid #526078;border-radius:14px;padding:20px}h1{color:#d9b36c}.ok{color:#7ed19a}.bad{color:#ff8d86}code{word-break:break-all}</style></head><body><div class="box"><h1>🕯️ Adaptive v2.6 Beta</h1><p id="player"></p><p id="status">正在連接 Supabase…</p><pre id="detail"></pre><p>連線成功後請用下一個完整Beta版本；此修正版先驗證Supabase初始化問題。</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://wxusktzdvpqxhxpyondx.supabase.co';
const SUPABASE_KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM';
const USERS=['Chelsea','Felix','Rachel','Savanna'];
const qp=new URLSearchParams(location.search);
const STUDENT=USERS.includes(qp.get('student'))?qp.get('student'):(localStorage.getItem('studyGamesUser')||'Chelsea');
document.getElementById('player').textContent='玩家：'+STUDENT;
async function init(){
 try{
   const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
   let r=await sb.from('students').select('id,current_primary_level').ilike('name',STUDENT).limit(1).maybeSingle();
   if(r.error) throw r.error; if(!r.data) throw new Error('找不到玩家 '+STUDENT);
   const student=r.data;
   r=await sb.from('questions').select('id',{count:'exact',head:true}).eq('active',true).lte('primary_level',student.current_primary_level||6);
   if(r.error) throw r.error;
   document.getElementById('status').className='ok';
   document.getElementById('status').textContent='✅ Supabase連線成功';
   document.getElementById('detail').textContent=`Player: ${STUDENT}
Grade: P${student.current_primary_level||6}
Eligible questions: ${r.count??'unknown'}
URL: ${SUPABASE_URL}`;
 }catch(e){
   console.error('v2.6 connection test failed:',e);
   document.getElementById('status').className='bad';
   document.getElementById('status').textContent='⚠️ 載入失敗';
   document.getElementById('detail').textContent=(e&&e.message)||String(e);
 }
}
init();
</script></body></html>
