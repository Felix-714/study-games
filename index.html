<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>莊園英文逃生 · Adaptive Practice</title><style>
:root{--gold:#d9b36c;--card:rgba(15,20,29,.93);--line:#4d5665;--text:#f0eadf;--muted:#b5b0a5;--good:#7ed19a;--bad:#ff8d86}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,"Noto Sans HK",sans-serif;background:#080b10 url('manor-background.png') center/cover fixed no-repeat;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(5,8,13,.93),rgba(8,12,18,.67),rgba(5,8,13,.93));z-index:-1}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 16px 50px #0008;border-radius:18px}.hero{padding:22px;text-align:center}.hero h1{margin:0;color:var(--gold);letter-spacing:2px}.hero p,.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#101620d9;border:1px solid #384254;border-radius:12px;padding:12px}.stat b{display:block;color:var(--gold);font-size:1.35rem}.panel{padding:20px;margin-top:16px}.mission{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:10px;background:#171d27;border:1px solid #414958;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#3e8f78,var(--gold),#6e2630)}.question{padding:16px;background:#111822eb;border-left:4px solid var(--gold);border-radius:8px}.meta{font-size:.76rem;color:#9eb0c8}.q{font-weight:750;font-size:1.05rem;margin:9px 0 12px}.options{display:grid;gap:8px}.option,.input{width:100%;text-align:left;padding:11px 12px;background:#17202c;border:1px solid #39475b;color:var(--text);border-radius:8px}.option{cursor:pointer}.option:hover,.option:focus,.input:focus{border-color:var(--gold);outline:none}.option.correct{background:#183929;border-color:var(--good)}.option.wrong{background:#462027;border-color:var(--bad)}.explain{margin-top:10px;color:#d9d0be;font-size:.9rem}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:1px solid #80683d;background:#322817;color:#f5dfb0;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:700}.btn.secondary{background:#151c26;border-color:#46536a;color:#d8e0ec}.btn:disabled{opacity:.35;cursor:not-allowed}.status{position:fixed;right:10px;bottom:10px;background:#111822;border:1px solid #566174;padding:8px 11px;border-radius:8px;font-size:.76rem}.good{color:var(--good)}.bad{color:var(--bad)}.hidden{display:none}.result{text-align:center;padding:18px}.score{font-size:3rem;color:var(--gold);font-weight:900}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.mission{align-items:flex-start;flex-direction:column}.wrap{padding:9px}.panel{padding:13px}}
</style></head><body><main class="wrap"><section class="hero"><h1>🕯️ 莊園英文逃生</h1><p>Database-driven Adaptive Practice · 破解密碼機，開啟逃生大門</p><div class="stats"><div class="stat"><b id="sAttempts">–</b>歷史作答</div><div class="stat"><b id="sAccuracy">–</b>正確率</div><div class="stat"><b id="sWeak">–</b>目前弱項</div><div class="stat"><b id="sBank">–</b>題庫</div></div></section><section class="panel"><div class="mission"><div><h2 id="title">正在讀取 Supabase 題庫…</h2><div id="subtitle" class="meta">系統會優先選未做題、弱項及最近答錯內容。</div></div><button class="btn secondary" id="newBtn" type="button">重新抽取任務</button></div><div class="progress"><div id="bar" class="bar" style="width:0"></div></div><div id="quiz"></div><div id="result" class="result hidden"></div><div class="actions"><button id="prevBtn" class="btn secondary" type="button">⬅ 上一題</button><button id="nextBtn" class="btn" type="button">下一題 ➡</button></div></section></main><div id="cloud" class="status">☁️ 正在連接 Supabase…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://wxusktzdvpqxhxpyondx.supabase.co',SB_KEY='sb_publishable_5GiK7W35mbXULkBFTdctPg_YchxjQEM',STUDENT='Chelsea',GAME='adaptive-database-v2';
let sb,studentId,sessionId,BANK=[],history=[],mission=[],idx=0,answers={},openedAt=Date.now();const $=id=>document.getElementById(id);
function status(t,c=''){$('cloud').textContent=t;$('cloud').className='status '+c}function pct(n,d){return d?Math.round(n/d*100):0}function norm(v){return String(v??'').trim().toLowerCase()}
function summarize(){const correct=history.filter(x=>x.is_correct).length;$('sAttempts').textContent=history.length;$('sAccuracy').textContent=history.length?pct(correct,history.length)+'%':'新';$('sBank').textContent=BANK.length;const m={};history.forEach(x=>{const k=x.sub_skill||x.skill||'未分類';m[k]??={c:0,n:0};m[k].n++;if(x.is_correct)m[k].c++});const weak=Object.entries(m).filter(([,v])=>v.n>=2).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n)[0];$('sWeak').textContent=weak?weak[0]:'建立中'}
function selectMission(){const recent=new Set(history.slice(0,25).map(x=>x.question_id)),stats={};history.forEach(x=>{const k=x.sub_skill||'';stats[k]??={c:0,n:0};stats[k].n++;if(x.is_correct)stats[k].c++});const scored=BANK.map(q=>{const st=stats[q.sub_skill]||{c:0,n:0},acc=st.n?st.c/st.n:.65,seen=history.filter(x=>x.question_id===q.id);let score=!seen.length?55:0;score+=(1-acc)*45;if(seen.some(x=>!x.is_correct))score+=28;if(recent.has(q.id))score-=45;score+=Math.random()*20;if(q.difficulty===3&&history.length<10)score-=18;return{...q,score,reason:!seen.length?'未做新題':acc<.65?'弱項補強':seen.some(x=>!x.is_correct)?'錯題重溫':'間隔複習'}}).sort((a,b)=>b.score-a.score);mission=[];const counts={};for(const q of scored){if(mission.length>=10)break;if((counts[q.sub_skill]||0)>=3)continue;mission.push(q);counts[q.sub_skill]=(counts[q.sub_skill]||0)+1}idx=0;answers={};openedAt=Date.now();render()}
function render(){const q=mission[idx];if(!q)return;$('title').textContent=`密碼機 ${idx+1} / ${mission.length}`;$('subtitle').textContent=`Chelsea 專屬任務 · ${q.reason}`;$('bar').style.width=`${idx/mission.length*100}%`;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');const a=answers[q.id];let h=`<article class="question"><div class="meta">${q.topic} · ${q.skill} / ${q.sub_skill} · 難度 ${q.difficulty}</div><div class="q">${idx+1}. ${q.question_text}</div>`;if(q.question_type==='fill'){h+=`<input id="fillAnswer" class="input" autocomplete="off" placeholder="輸入英文答案" ${a?'disabled':''} value="${a?.submitted||''}"><div style="margin-top:9px"><button class="btn" type="button" onclick="submitFill()" ${a?'disabled':''}>提交答案</button></div>`}else{h+='<div class="options">';(q.options||[]).forEach(o=>{let c='option';if(a){if(norm(o)===norm(q.correct_answer))c+=' correct';else if(norm(o)===norm(a.submitted))c+=' wrong'}h+=`<button type="button" class="${c}" onclick='choose(${JSON.stringify(o)})' ${a?'disabled':''}>${o}</button>`});h+='</div>'}if(a)h+=`<div class="explain">${a.correct?'✅ 密碼破譯成功':'❌ 線索未對上'} · ${q.explanation}</div>`;h+='</article>';$('quiz').innerHTML=h;$('prevBtn').disabled=idx===0;$('nextBtn').textContent=idx===mission.length-1?'完成任務 🏁':'下一題 ➡';$('nextBtn').disabled=!a}
function submitFill(){const input=$('fillAnswer');if(input&&input.value.trim())choose(input.value.trim())}
async function choose(submitted){const q=mission[idx];if(answers[q.id])return;const correct=norm(submitted)===norm(q.correct_answer);answers[q.id]={submitted,correct};render();status('☁️ 正在保存作答…');const r=await sb.from('attempts').insert({student_id:studentId,session_id:sessionId,question_id:q.id,submitted_answer:submitted,correct_answer:q.correct_answer,is_correct:correct,response_time_ms:Date.now()-openedAt,hint_used:false,attempt_number:1,topic:q.topic,skill:q.skill,sub_skill:q.sub_skill,difficulty:q.difficulty});if(r.error){console.error(r.error);status('⚠️ 保存失敗','bad')}else{status('✅ 作答已保存','good');history.unshift({question_id:q.id,is_correct:correct,skill:q.skill,sub_skill:q.sub_skill,answered_at:new Date().toISOString()});summarize()}}
async function createSession(){const r=await sb.from('practice_sessions').insert({student_id:studentId,game:GAME}).select('id').single();if(r.error)throw r.error;sessionId=r.data.id;sessionStorage.setItem('adaptiveDatabaseSession',sessionId)}
async function finish(){const score=Object.values(answers).filter(x=>x.correct).length;$('bar').style.width='100%';$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<div class="score">${score}/10</div><h2>${score>=8?'逃生大門已開啟！':'密碼機仍需要再破解'}</h2><p>下一輪會按最新結果重新選題。</p><button class="btn" type="button" onclick="startNew()">開始下一輪任務</button>`;$('nextBtn').disabled=true;$('prevBtn').disabled=true;await sb.from('practice_sessions').update({completed_at:new Date().toISOString(),total_questions:10,correct_count:score}).eq('id',sessionId)}
async function startNew(){try{sessionStorage.removeItem('adaptiveDatabaseSession');await createSession();selectMission()}catch(e){console.error(e);status('⚠️ 無法建立新任務','bad')}}
async function init(){try{sb=window.supabase.createClient(SB_URL,SB_KEY);let r=await sb.from('students').select('id').eq('name',STUDENT).limit(1).maybeSingle();if(r.error||!r.data)throw r.error||new Error('找不到 Chelsea');studentId=r.data.id;r=await sb.from('questions').select('id,game,topic,skill,sub_skill,difficulty,question_type,question_text,options,correct_answer,explanation').eq('active',true);if(r.error)throw r.error;BANK=(r.data||[]).filter(q=>q.question_text&&q.correct_answer&&q.explanation&&(q.question_type==='fill'||Array.isArray(q.options)));if(BANK.length<10)throw new Error('完整題目少於10條');r=await sb.from('attempts').select('question_id,is_correct,skill,sub_skill,answered_at').eq('student_id',studentId).order('answered_at',{ascending:false}).limit(500);if(r.error)throw r.error;history=r.data||[];sessionId=sessionStorage.getItem('adaptiveDatabaseSession');if(!sessionId)await createSession();summarize();selectMission();status('✅ Database-driven Adaptive Learning 已連線','good')}catch(e){console.error(e);status('⚠️ 連線失敗','bad');$('title').textContent='未能建立任務';$('subtitle').textContent=e?.message||'請檢查 Supabase。'}}
$('prevBtn').addEventListener('click',()=>{if(idx>0){idx--;openedAt=Date.now();render()}});$('nextBtn').addEventListener('click',()=>{if(!answers[mission[idx]?.id])return;if(idx<mission.length-1){idx++;openedAt=Date.now();render()}else finish()});$('newBtn').addEventListener('click',()=>{if(confirm('重新抽取10題？已保存答案會保留。'))startNew()});init();
</script></body></html>
